name: TheNuus

options:
  bundleIdPrefix: com.thenuus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "202608191900"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  TheNuus:
    build:
      targets:
        TheNuus: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TheNuusUITests
    archive:
      config: Release

targets:
  TheNuus:
    type: application
    platform: iOS
    sources:
      - path: TheNuus
    dependencies:
      - package: PostHog
      - target: TheNuusWidget
    info:
      path: TheNuus/Info.plist
      properties:
        CFBundleDisplayName: The Nuus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thenuus.app
        PRODUCT_NAME: The Nuus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  TheNuusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TheNuusUITests
    dependencies:
      - target: TheNuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thenuus.app.UITests

  TheNuusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TheNuusWidget
      - path: TheNuus/Model.swift
      - path: TheNuus/Theme.swift
      - path: TheNuus/Fonts/ArchivoBlack-Regular.ttf
    info:
      path: TheNuusWidget/Info.plist
      properties:
        CFBundleDisplayName: The Nuus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thenuus.app.NuusWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
