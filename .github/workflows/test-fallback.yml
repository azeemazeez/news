name: Test Curation Fallback

# Runs only the final fallback model in dry-run mode: no data written, no email, no commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fallback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Curate with fallback model only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-news.js --fallback-only --dry-run
